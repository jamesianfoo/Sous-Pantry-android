[versions]
agp                 = "8.7.3"
kotlin              = "2.1.0"
ksp                 = "2.1.0-1.0.29"
hilt                = "2.52"
compose-bom         = "2025.01.00"
navigation-compose  = "2.8.5"
room                = "2.7.0"
lifecycle           = "2.8.7"
retrofit            = "2.11.0"
okhttp              = "4.12.0"
coil                = "2.7.0"
mlkit-barcode       = "17.3.0"
mlkit-text          = "16.0.1"
camerax             = "1.4.1"
coroutines          = "1.9.0"
datastore           = "1.1.2"
serialization-json  = "1.7.3"
accompanist         = "0.36.0"
firebase-bom        = "33.7.0"
workmanager         = "2.10.0"
play-location       = "21.3.0"

[libraries]
# Compose BOM
compose-bom          = { group = "androidx.compose", name = "compose-bom",          version.ref = "compose-bom" }
compose-ui           = { group = "androidx.compose.ui",  name = "ui" }
compose-ui-tooling   = { group = "androidx.compose.ui",  name = "ui-tooling" }
compose-material3    = { group = "androidx.compose.material3", name = "material3" }
compose-icons        = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose     = { group = "androidx.activity",    name = "activity-compose",  version = "1.10.0" }

# Navigation
navigation-compose   = { group = "androidx.navigation",  name = "navigation-compose", version.ref = "navigation-compose" }

# Lifecycle
lifecycle-viewmodel  = { group = "androidx.lifecycle",   name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime    = { group = "androidx.lifecycle",   name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }

# Hilt DI
hilt-android         = { group = "com.google.dagger",    name = "hilt-android",      version.ref = "hilt" }
hilt-compiler        = { group = "com.google.dagger",    name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation      = { group = "androidx.hilt",        name = "hilt-navigation-compose", version = "1.2.0" }

# Room
room-runtime         = { group = "androidx.room",        name = "room-runtime",      version.ref = "room" }
room-ktx             = { group = "androidx.room",        name = "room-ktx",          version.ref = "room" }
room-compiler        = { group = "androidx.room",        name = "room-compiler",     version.ref = "room" }

# Retrofit + OkHttp
retrofit             = { group = "com.squareup.retrofit2", name = "retrofit",         version.ref = "retrofit" }
retrofit-gson        = { group = "com.squareup.retrofit2", name = "converter-gson",   version.ref = "retrofit" }
okhttp               = { group = "com.squareup.okhttp3",   name = "okhttp",           version.ref = "okhttp" }
okhttp-logging       = { group = "com.squareup.okhttp3",   name = "logging-interceptor", version.ref = "okhttp" }

# Coil (image loading)
coil-compose         = { group = "io.coil-kt",           name = "coil-compose",      version.ref = "coil" }

# ML Kit
mlkit-barcode        = { group = "com.google.mlkit",     name = "barcode-scanning",  version.ref = "mlkit-barcode" }
mlkit-text           = { group = "com.google.mlkit",     name = "text-recognition",  version.ref = "mlkit-text" }

# CameraX
camerax-core         = { group = "androidx.camera",      name = "camera-core",       version.ref = "camerax" }
camerax-camera2      = { group = "androidx.camera",      name = "camera-camera2",    version.ref = "camerax" }
camerax-lifecycle    = { group = "androidx.camera",      name = "camera-lifecycle",  version.ref = "camerax" }
camerax-view         = { group = "androidx.camera",      name = "camera-view",       version.ref = "camerax" }
camerax-mlkit        = { group = "androidx.camera",      name = "camera-mlkit-vision", version.ref = "camerax" }

# DataStore
datastore-prefs      = { group = "androidx.datastore",   name = "datastore-preferences", version.ref = "datastore" }

# Coroutines
coroutines-android   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Serialization
serialization-json   = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization-json" }

# Accompanist (permissions)
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }

# Firebase (FCM push notifications)
firebase-bom         = { group = "com.google.firebase",  name = "firebase-bom",              version.ref = "firebase-bom" }
firebase-messaging   = { group = "com.google.firebase",  name = "firebase-messaging-ktx" }

# WorkManager (background sync, geofence)
workmanager          = { group = "androidx.work",         name = "work-runtime-ktx",          version.ref = "workmanager" }

# Play Services Location (geofencing)
play-location        = { group = "com.google.android.gms", name = "play-services-location",   version.ref = "play-location" }

[plugins]
android-application    = { id = "com.android.application",            version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                   = { id = "com.google.dagger.hilt.android",     version.ref = "hilt" }
ksp                    = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
google-services        = { id = "com.google.gms.google-services",      version = "4.4.2" }
